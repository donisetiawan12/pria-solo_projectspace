<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProjectSpace — Portfolio Platform</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
          colors: {
            github: { canvas: '#0d1117', card: '#161b22', border: '#30363d', accent: '#58a6ff', green: '#2ea44f' },
            linkedin: { blue: '#0a66c2', dark: '#1d2226', light: '#f3f2ef' }
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f3f2ef; }
    .hero-gradient { background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0a66c2 100%); }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // --- COMPONENT: FOOTER ---
    function Footer() {
      return (
        <footer className="py-8 border-t border-slate-200 bg-white mt-auto">
          <div className="max-w-7xl mx-auto px-6 text-center text-slate-500 text-[11px]">
            <p className="font-bold text-slate-800 mb-2">ProjectSpace © 2026</p>
            <p>Platform Kolaborasi Mahasiswa IT & Cybersecurity</p>
          </div>
        </footer>
      );
    }

    // --- COMPONENT: LANDING PAGE ---
    function LandingPage({ onExplore, onOpenAuth }) {
      return (
        <div className="min-h-screen hero-gradient text-white flex flex-col items-center justify-center p-6 text-center">
          <nav className="absolute top-0 w-full p-6 flex justify-between items-center max-w-7xl">
            <div className="font-black text-xl flex items-center gap-2"> ProjectSpace</div>
            <button onClick={onOpenAuth} className="bg-[#0a66c2] px-4 py-2 rounded text-xs font-bold hover:bg-[#004182] transition-colors">
              Masuk / Sign In
            </button>
          </nav>

          <div className="max-w-3xl fade-in">
            <span className="text-[10px] uppercase tracking-widest bg-blue-900/50 px-3 py-1 rounded-full mb-4 inline-block">Platform Karya & Jejaring Mahasiswa</span>
            <h1 className="text-5xl font-bold leading-tight">Ketika Kode Git Menemukan <br/><span className="text-[#58a6ff]">Jaringan Profesional Anda.</span></h1>
            <p className="mt-6 text-slate-300 text-sm max-w-xl mx-auto">ProjectSpace adalah wadah hibrida tempat mahasiswa memamerkan kode, skema basis data, ulasan tugas, hingga integrasi hardware IoT.</p>
            <div className="mt-8 flex gap-4 justify-center">
              <button onClick={onExplore} className="bg-[#2ea44f] hover:bg-[#39d353] px-6 py-3 rounded-lg font-bold text-sm transition-all">Jelajahi Feed Karya</button>
              <button onClick={onOpenAuth} className="border border-white/30 hover:bg-white/10 px-6 py-3 rounded-lg font-bold text-sm transition-all">Daftarkan Akun Anda</button>
            </div>
          </div>
        </div>
      );
    }

    // --- COMPONENT: DASHBOARD ---
    function Dashboard({ onLogout }) {
      return (
        <div className="min-h-screen bg-[#f3f2ef] flex flex-col">
          {/* Navbar */}
          <nav className="bg-white border-b border-slate-200 sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-6 h-16 flex justify-between items-center">
              <div className="font-black text-lg cursor-pointer">
                Project<span className="text-[#0a66c2]">Space</span>
              </div>
              <div className="flex items-center gap-4">
                <button className="text-slate-500 hover:text-black font-bold text-xs">Feed</button>
                <button onClick={onLogout} className="text-xs bg-slate-100 hover:bg-slate-200 px-4 py-1.5 rounded font-bold text-slate-700">
                  Keluar
                </button>
              </div>
            </div>
          </nav>

          {/* Main Content: flex-grow memastikan footer terdorong ke bawah */}
          <main className="max-w-7xl mx-auto p-6 flex-grow w-full">
            <div className="bg-white rounded-lg border border-slate-200 p-8 shadow-sm">
              <h2 className="text-2xl font-bold text-slate-800">Selamat Datang di Dashboard!</h2>
              <p className="text-slate-500 mt-2">Ini adalah area feed karya mahasiswa.</p>
            </div>
          </main>

          <Footer />
        </div>
      );
    }

    // --- APP CONTAINER ---
    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [showAuthModal, setShowAuthModal] = useState(false);

      if (!isLoggedIn) {
        return (
          <>
            <LandingPage onExplore={() => setIsLoggedIn(true)} onOpenAuth={() => setShowAuthModal(true)} />
            {showAuthModal && (
              <div className="fixed inset-0 bg-slate-900/80 flex items-center justify-center z-50 p-4">
                <div className="bg-[#161b22] p-8 rounded-xl text-white max-w-sm w-full border border-[#30363d]">
                  <h2 className="text-xl font-bold mb-4">Masuk ke ProjectSpace</h2>
                  <button onClick={() => { setIsLoggedIn(true); setShowAuthModal(false); }} className="w-full bg-[#0a66c2] py-2 rounded font-bold">Simulasi Login</button>
                  <button onClick={() => setShowAuthModal(false)} className="w-full mt-2 text-slate-400 text-xs">Batal</button>
                </div>
              </div>
            )}
          </>
        );
      }

      return <Dashboard onLogout={() => setIsLoggedIn(false)} />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
